<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Brainzaib AI</title>
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #00bfff;
    }
    #chat {
      padding: 20px;
      height: 70vh;
      overflow-y: scroll;
      border-bottom: 1px solid #444;
    }
    .message {
      margin: 10px 0;
    }
    .user {
      color: #00ff88;
    }
    .bot {
      color: #ffcc00;
    }
    #input-area {
      display: flex;
      padding: 10px;
      background-color: #111;
    }
    #input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      margin-right: 10px;
    }
    #send {
      padding: 10px 20px;
      border: none;
      background-color: #00bfff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Brainzaib AI Chat</header>
  <div id="chat"></div>
  <div id="input-area">
    <input type="text" id="input" placeholder="Type your message here..." />
    <button id="send">Send</button>
  </div>

  <script>
    const apiKey = "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";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    send.addEventListener("click", async () => {
      const message = input.value;
      if (!message) return;

      addMessage("You", message, "user");
      input.value = "";

      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "gpt-3.5-turbo",
          messages: [{ role: "user", content: message }]
        })
      });

      const data = await response.json();
      const reply = data.choices?.[0]?.message?.content || "Error: No response.";
      addMessage("Brainzaib", reply, "bot");
    });

    function addMessage(sender, text, cls) {
      const msg = document.createElement("div");
      msg.className = `message ${cls}`;
      msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      chat.appendChild(msg);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
